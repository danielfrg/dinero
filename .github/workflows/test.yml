name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dinero_test
          POSTGRES_PASSWORD: dinero_test_password
          POSTGRES_DB: dinero_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dinero_test -d dinero_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DINERO_TEST_POSTGRES_DSN: postgresql://dinero_test:dinero_test_password@127.0.0.1:5432/dinero_test
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Verify installer and native release package
        run: |
          bash scripts/install_test.sh
          bash scripts/package_test.sh
          bash scripts/publish-main_test.sh
      - name: Go test, PostgreSQL contracts, vet and race
        run: |
          go test ./...
          go vet ./...
          go test -race ./...
      - name: Build Go executable
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/dinero ./cmd/dinero
  container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: dinero:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Smoke nonroot container REST and official MCP SDK
        run: bash scripts/container-smoke.sh dinero:ci

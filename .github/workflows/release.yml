name: Release
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: ['Checks']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version for an artifact-only build (for example v1.2.3)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false
jobs:
  metadata:
    # Main packages come only from successful checks of pushes to this repository.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Select build version and source commit
        id: release
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          source scripts/install.sh
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            version="v0.0.0-main.g${BUILD_SHA:0:12}"
            channel=main
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version="$GITHUB_REF_NAME"
            channel=release
          else
            version="$INPUT_VERSION"
            channel=artifact
          fi
          version=$(dinero_version "$version")
          printf 'version=%s\ncommit=%s\nchannel=%s\n' "$version" "$BUILD_SHA" "$channel" >> "$GITHUB_OUTPUT"
  checks:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Test and vet
        run: go test ./... && go vet ./...
      - name: Verify installer and native release package
        run: |
          bash scripts/install_test.sh
          bash scripts/package_test.sh
          bash scripts/publish-main_test.sh
  binaries:
    needs: [metadata, checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - name: Build release package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          bash scripts/package.sh "$VERSION" "$GOOS" "$GOARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: dinero-package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
  image:
    needs: [metadata, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load native runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: dinero:release-check
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            VCS_REF=${{ needs.metadata.outputs.commit }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,scope=container-${{ matrix.arch }},mode=max
      - name: Smoke native runtime REST and official MCP SDK
        run: bash scripts/container-smoke.sh dinero:release-check

  publish-image:
    needs: [metadata, checks, image]
    if: >-
      github.repository == 'danielfrg/dinero' &&
      (needs.metadata.outputs.channel == 'main' || needs.metadata.outputs.channel == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: dinero-container-publish
      cancel-in-progress: false
    steps:
      # workflow_run uses the tested commit, never the newer default-branch HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          fetch-depth: 0
      - name: Validate publication source
        id: ref
        env:
          BUILD_SHA: ${{ needs.metadata.outputs.commit }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BUILD_SHA" ]]
          git fetch origin main --no-tags
          if [[ "$CHANNEL" == release ]]; then
            [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]
            source scripts/install.sh
            [[ "$(dinero_version "$GITHUB_REF_NAME")" == "$VERSION" ]]
            [[ "$(git rev-parse "$GITHUB_REF^{commit}")" == "$BUILD_SHA" ]]
            git merge-base --is-ancestor "$BUILD_SHA" origin/main
          elif [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$BUILD_SHA" ]]; then
            echo 'Skipping stale main image publication.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.ref.outputs.current == 'true'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: steps.ref.outputs.current == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing immutable main image
        if: steps.ref.outputs.current == 'true' && needs.metadata.outputs.channel == 'main'
        id: existing
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ needs.metadata.outputs.commit }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          registry_dir=$(mktemp -d "$RUNNER_TEMP/dinero-registry.XXXXXX")
          trap 'rm -rf "$registry_dir"' EXIT
          token=$(curl --fail --silent --show-error --user "$REGISTRY_USER:$REGISTRY_PASSWORD" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:danielfrg/dinero:pull,push' | jq -er '.token')
          printf '::add-mask::%s\n' "$token"
          status=$(curl --silent --show-error -o "$registry_dir/manifest.json" -D "$registry_dir/headers" \
            -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/danielfrg/dinero/manifests/sha-$BUILD_SHA")
          case "$status" in
            404)
              jq -e '.errors | length > 0 and all(.[]; .code == "MANIFEST_UNKNOWN" or .code == "NAME_UNKNOWN")' \
                "$registry_dir/manifest.json" >/dev/null
              echo 'No existing main image; building it once.'
              ;;
            200)
              jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] |
                index("amd64") != null and index("arm64") != null' "$registry_dir/manifest.json" >/dev/null
              digest=$(awk 'tolower($1) == "docker-content-digest:" { sub(/\r$/, "", $2); print $2 }' "$registry_dir/headers")
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "sha256:$(sha256sum "$registry_dir/manifest.json" | cut -d ' ' -f 1)" == "$digest" ]]
              docker pull "ghcr.io/danielfrg/dinero@$digest"
              docker image inspect "ghcr.io/danielfrg/dinero@$digest" --format '{{json .Config.Labels}}' | \
                jq -e --arg sha "$BUILD_SHA" --arg version "$VERSION" \
                  '.["org.opencontainers.image.revision"] == $sha and
                   .["org.opencontainers.image.version"] == $version and
                   .["org.opencontainers.image.source"] == "https://github.com/danielfrg/dinero"' >/dev/null
              printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
              ;;
            *) printf 'Cannot check existing image: GHCR returned HTTP %s.\n' "$status" >&2; exit 1 ;;
          esac
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        if: steps.ref.outputs.current == 'true'
        id: meta
        with:
          images: ghcr.io/danielfrg/dinero
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ needs.metadata.outputs.commit }},enable=${{ needs.metadata.outputs.channel == 'main' }}
            type=raw,value=latest,enable=${{ needs.metadata.outputs.channel == 'main' }}
            type=semver,pattern={{version}},value=${{ needs.metadata.outputs.version }},enable=${{ needs.metadata.outputs.channel == 'release' }}
          labels: |
            org.opencontainers.image.source=https://github.com/danielfrg/dinero
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
      - name: Publish new main or versioned release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.ref.outputs.current == 'true' && steps.existing.outputs.digest == ''
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.metadata.outputs.channel == 'main' && format('ghcr.io/danielfrg/dinero:sha-{0}', needs.metadata.outputs.commit) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            VCS_REF=${{ needs.metadata.outputs.commit }}
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-arm64
            type=gha,scope=publish
          cache-to: type=gha,scope=publish,mode=max
      - name: Promote verified digest to channel tags
        if: steps.ref.outputs.current == 'true'
        env:
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          BUILD_SHA: ${{ needs.metadata.outputs.commit }}
          CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          printf 'Image: `ghcr.io/danielfrg/dinero@%s`\n\nSource commit: `%s`\n' "$IMAGE_DIGEST" "$BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$CHANNEL" == main ]]; then
            if [[ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$BUILD_SHA" ]]; then
              echo 'Main advanced during the image build; leaving latest unchanged.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            docker buildx imagetools create --tag ghcr.io/danielfrg/dinero:latest "ghcr.io/danielfrg/dinero@$IMAGE_DIGEST"
          fi
          printf '\nTags:\n```\n%s\n```\n' "$IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
  assets:
    needs: [metadata, binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dinero-package-*
          merge-multiple: true
          path: dist/
      - name: Assemble and verify release assets
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          LC_ALL=C sort dist/*.tar.gz.sha256 > dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)
          cp scripts/install.sh dist/install.sh
          printf '%s\n' "$VERSION" > dist/VERSION
          rm dist/*.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dinero-release
          path: dist/
          if-no-files-found: error
  publish:
    if: needs.metadata.outputs.channel == 'release'
    needs: [metadata, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dinero-release
          path: dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          release_flags=(--verify-tag --generate-notes --title "Dinero $VERSION")
          release_version=${VERSION%%+*}
          if [[ "$release_version" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS dist/install.sh "${release_flags[@]}"
  publish-main:
    if: needs.metadata.outputs.channel == 'main'
    needs: [metadata, assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dinero-release
          path: dist/
      - name: Update rolling main prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_SHA: ${{ needs.metadata.outputs.commit }}
        run: bash scripts/publish-main.sh "$VERSION" "$BUILD_SHA" dist

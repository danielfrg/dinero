name: Go release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version label for manual artifact build
        required: true
        type: string
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
      - name: Test and vet
        run: go test ./... && go vet ./...
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X github.com/danielfrg/dinero/internal/cli.Version=$VERSION" -o "dist/dinero-$GOOS-$GOARCH" ./cmd/dinero
          cd dist && sha256sum "dinero-$GOOS-$GOARCH" > "dinero-$GOOS-$GOARCH.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dinero-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local image artifact without publishing
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: docker build --build-arg VERSION="$VERSION" --build-arg VCS_REF="${{ github.sha }}" -t "dinero:$VERSION" .
